<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Task Manager: system architecture</text>

  <rect x="30" y="64" width="300" height="440" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="180" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#3730a3">Flutter app (Android)</text>
  <rect x="50" y="108" width="260" height="92" rx="8" fill="#ffffff" stroke="#818cf8"/>
  <text x="180" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b4b">Presentation</text>
  <text x="180" y="154" text-anchor="middle" font-size="12" fill="#334155">Pages and widgets</text>
  <text x="180" y="172" text-anchor="middle" font-size="12" fill="#334155">Riverpod StateNotifiers</text>
  <text x="180" y="190" text-anchor="middle" font-size="12" fill="#334155">loading / error / empty / data</text>
  <rect x="50" y="226" width="260" height="92" rx="8" fill="#ffffff" stroke="#818cf8"/>
  <text x="180" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b4b">Domain (pure Dart)</text>
  <text x="180" y="272" text-anchor="middle" font-size="12" fill="#334155">Entities, use cases</text>
  <text x="180" y="290" text-anchor="middle" font-size="12" fill="#334155">Abstract repositories</text>
  <text x="180" y="308" text-anchor="middle" font-size="12" fill="#334155">Either&lt;Failure, T&gt;</text>
  <rect x="50" y="344" width="260" height="140" rx="8" fill="#ffffff" stroke="#818cf8"/>
  <text x="180" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b4b">Data</text>
  <text x="180" y="390" text-anchor="middle" font-size="12" fill="#334155">Repository implementations, models</text>
  <text x="180" y="408" text-anchor="middle" font-size="12" fill="#334155">Dio remote data sources</text>
  <text x="180" y="426" text-anchor="middle" font-size="12" fill="#334155">AuthInterceptor: JWT + refresh on 401</text>
  <text x="180" y="444" text-anchor="middle" font-size="12" fill="#334155">SecureTokenStorage (Keystore)</text>
  <text x="180" y="470" text-anchor="middle" font-size="11" fill="#64748b">layers depend inward only</text>
  <line x1="180" y1="200" x2="180" y2="226" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180" y1="344" x2="180" y2="318" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="196" y="335" font-size="10" fill="#64748b">implements</text>

  <rect x="420" y="64" width="520" height="440" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="680" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">Railway (live deployment)</text>
  <rect x="440" y="106" width="480" height="38" rx="8" fill="#ffffff" stroke="#34d399"/>
  <text x="680" y="130" text-anchor="middle" font-size="13" fill="#064e3b">Edge proxy: TLS (HTTPS), sets X-Forwarded-For</text>
  <rect x="440" y="158" width="480" height="250" rx="10" fill="#f0fdf4" stroke="#34d399" stroke-dasharray="5 4"/>
  <text x="456" y="178" font-size="12" font-weight="700" fill="#065f46">FastAPI container (Docker)</text>
  <rect x="460" y="190" width="440" height="40" rx="8" fill="#ffffff" stroke="#34d399"/>
  <text x="680" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">Middleware</text>
  <text x="680" y="223" text-anchor="middle" font-size="11" fill="#334155">request ID, security headers, CORS, body limit, JSON logs</text>
  <rect x="460" y="240" width="440" height="40" rx="8" fill="#ffffff" stroke="#34d399"/>
  <text x="680" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">Routers</text>
  <text x="680" y="273" text-anchor="middle" font-size="11" fill="#334155">/auth (rate limited), /tasks, /users, /health. Pydantic validation + sanitizing</text>
  <rect x="460" y="290" width="440" height="40" rx="8" fill="#ffffff" stroke="#34d399"/>
  <text x="680" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">Services</text>
  <text x="680" y="323" text-anchor="middle" font-size="11" fill="#334155">business rules, PyJWT tokens, bcrypt</text>
  <rect x="460" y="340" width="440" height="56" rx="8" fill="#ffffff" stroke="#34d399"/>
  <text x="680" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">Repositories + models</text>
  <text x="680" y="373" text-anchor="middle" font-size="11" fill="#334155">SQLAlchemy. Every query filtered by owner_id.</text>
  <text x="680" y="388" text-anchor="middle" font-size="11" fill="#334155">Composite index (owner_id, created_at)</text>
  <line x1="680" y1="144" x2="680" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="230" x2="680" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="280" x2="680" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="330" x2="680" y2="340" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="440" y="432" width="480" height="56" rx="8" fill="#ffffff" stroke="#34d399"/>
  <text x="680" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">PostgreSQL (managed)</text>
  <text x="680" y="474" text-anchor="middle" font-size="11" fill="#334155">users, tasks. Schema managed by Alembic migrations 0001, 0002</text>
  <line x1="680" y1="396" x2="680" y2="432" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="310" y1="414" x2="420" y2="414" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="365" y="402" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">HTTPS</text>
  <text x="365" y="436" text-anchor="middle" font-size="10" fill="#334155">Bearer JWT</text>

  <rect x="980" y="64" width="190" height="84" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="1075" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Sentry</text>
  <text x="1075" y="112" text-anchor="middle" font-size="11" fill="#334155">unhandled exceptions,</text>
  <text x="1075" y="128" text-anchor="middle" font-size="11" fill="#334155">tagged with request_id</text>
  <rect x="980" y="170" width="190" height="84" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="1075" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Structured logs</text>
  <text x="1075" y="218" text-anchor="middle" font-size="11" fill="#334155">one JSON line per request</text>
  <text x="1075" y="234" text-anchor="middle" font-size="11" fill="#334155">(Railway log viewer)</text>
  <line x1="900" y1="210" x2="980" y2="116" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="260" x2="980" y2="212" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="980" y="290" width="190" height="198" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="1075" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">GitHub Actions</text>
  <text x="1075" y="344" text-anchor="middle" font-size="12" fill="#334155">1. lint, format, dead code</text>
  <text x="1075" y="364" text-anchor="middle" font-size="12" fill="#334155">2. migrations + tests</text>
  <text x="1075" y="380" text-anchor="middle" font-size="11" fill="#64748b">(coverage gate 85%)</text>
  <text x="1075" y="400" text-anchor="middle" font-size="12" fill="#334155">3. dependency audit</text>
  <text x="1075" y="420" text-anchor="middle" font-size="12" fill="#334155">4. Docker image build</text>
  <text x="1075" y="452" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">push to main</text>
  <text x="1075" y="468" text-anchor="middle" font-size="11" fill="#334155">then Railway redeploys</text>
  <line x1="980" y1="440" x2="940" y2="440" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="30" y="528" width="1140" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="48" y="552" font-size="13" font-weight="700" fill="#0f172a">Key decisions</text>
  <text x="48" y="574" font-size="12" fill="#334155">Clean architecture on the client: the domain layer has no Flutter or Dio imports. See docs/adr/0001-riverpod-over-bloc.md in the Flutter repo.</text>
  <text x="48" y="592" font-size="12" fill="#334155">JWT access + refresh tokens: the app refreshes silently on 401, and returns to login only if the refresh token is also rejected.</text>
  <text x="48" y="610" font-size="12" fill="#334155">PyJWT replaced python-jose after the dependency audit (docs/adr/0001-pyjwt-instead-of-python-jose.md in this repo).</text>
</svg>
